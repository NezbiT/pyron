<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Harbor Bindings{% endblock %}</title>
  <meta name="description" content="{% block description %}Used books, tide tables, and the odd stolen glossary. A harbor shop rendered on the server.{% endblock %}"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="mark" href="/">Harbor <span>Bindings</span></a>
    <nav aria-label="Primary">
      <a href="/" {% if page == "home" %}aria-current="page"{% endif %}>Shop</a>
      <a href="/catalog" {% if page == "catalog" %}aria-current="page"{% endif %}>Catalog</a>
      <a href="/acquire" {% if page == "acquire" %}aria-current="page"{% endif %}>Sell a book</a>
      <a href="/docs">API</a>
      <a href="/admin">Admin panel</a>
    </nav>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Open Tuesday–Saturday, 11–6. The door sticks when it rains — pull harder.</p>
    <p><a href="/health">System</a> · <a href="/redoc">ReDoc</a></p>
  </footer>
</body>
</html>
