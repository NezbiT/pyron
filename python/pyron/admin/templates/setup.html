{% extends "base.html" %}
{% block title %}{{ t('create_root') }}{% endblock %}
{% block gate %}
  <section class="gate-card">
    <p class="kicker">{{ t('kicker_first') }}</p>
    <h1>{{ t('create_root') }}</h1>
    <p class="lede">{{ t('create_root_lede') }}</p>
    {% if error %}
      <p class="banner" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ prefix }}/setup" novalidate>
      <input type="hidden" name="csrf" value="{{ csrf }}"/>
      <div class="field">
        <label for="username">{{ t('username') }}</label>
        <input id="username" name="username" value="{{ username }}" autocomplete="username" required minlength="2" maxlength="80"/>
      </div>
      <div class="field">
        <label for="password">{{ t('password') }}</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"/>
        <p class="hint">{{ t('password_hint') }}</p>
      </div>
      <div class="field">
        <label for="confirm">{{ t('password_again') }}</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8"/>
      </div>
      <button class="btn" type="submit">{{ t('create_root_btn') }}</button>
    </form>
    <div class="gate-prefs">{% include "_prefs.html" %}</div>
  </section>
{% endblock %}
