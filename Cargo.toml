[package]
name = "pyron-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust hot path for the Pyron web framework: routing, validation, serialization, OpenAPI."
license = "MIT"
publish = false

[lib]
name = "pyron_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.bench]
lto = "thin"
codegen-units = 1
